<script>
/* =====================================================================
   PERSONALIZE HERE: colours, messages, dialogue and the love letters
   ===================================================================== */
const CFG={
 ryaan:{hair:'#5a3524',outfit:'#f7a6c1',skin:'#f3cfae'},
 subhan:{hair:'#241812',outfit:'#6f8fe0',skin:'#dcae86'},
 // One message pops up per heart collected, 5 per level (levels 1, 3, 4)
 msgs:[
  ["Welcome to our little world, Bunny.","The Gorilla Glue is out here somewhere.","Keep following the hearts.","Proud of you already.","Almost through the flowers!"],
  ["Wish I could be there beside you right now.","Even from miles away, you're my favourite person.","Imagine how tightly I'm going to hug you.","Every road is worth it if it leads to you.","Keep going, my girl. I'm waiting for you."],
  ["I can almost see you.","The glue is tingling. You're close.","Half a braincell and all of my heart.","One last stretch, Bunny.","Look up. I'm right here."]],
 // >>> EDIT ME: shown after the Shared Braincell Exam (Level 2) <<<
 FINAL_BRAINCELL_LOVE_LETTER:"My Bunny ❤️\n\nLOOK AT YOU, USING OUR ONE SHARED BRAINCELL ALL BY YOURSELF. I'M SO PROUD OF YOU. 😭\n\nI wish I could be there beside you, helping you through every difficult question life throws at you. Since I can't, I wanted to leave little pieces of us in this world for you to find.\n\nSo whenever things get difficult, remember our stupid jokes, our memories, and the fact that we somehow managed to share one braincell and still make it this far.\n\nNow hurry up and find me, Bunny. I've apparently been left alone with zero braincells, and we both know that's a dangerous situation.\n\nI love you. ❤️",
 // Shown at the final reunion
 REUNION_MESSAGE:"BUNNY. YOU ACTUALLY FOUND ME. ❤️\n\nAfter all those obstacles, all that distance, and the world's most ridiculous boss fight, you made it.\n\nI wish I could give you the biggest hug right now. I wish I could be there beside you, making you laugh, annoying you, and reminding you that you're never just a character wandering through this world alone.\n\nI made this little adventure because I can't always be there in person, but I wanted to give you a world where you could find me no matter how far apart we started.\n\nAnd look at that. The Gorilla Glue is back. We're officially stuck together again. 😭❤️\n\nI really hope that one day, this won't just be a game about finding each other. I hope we'll get to meet, hug, and make memories that don't need a screen to exist.\n\nUntil then, keep this little world as a reminder of us.\n\nI love you, Bunny. ❤️\n\nNOW EXPLAIN YOURSELF.\nWHY DID YOU LET THE GORILLA GLUE DRY OFF?! 😭",
 // >>> EDIT ME: the longer letter in the secret ending (all 15 hearts) <<<
 SECRET_LETTER:"My Bunny ❤️\n\nYou found every little piece.\n\nEvery memory, every stupid joke, every little reminder of us. I put them throughout this world because I wanted you to have something that felt like us, even when I couldn't be there beside you.\n\nThe Gorilla Glue was always our stupid little joke, but I think that's why I love it so much. It reminds me of how we always wanted to stick together, even when life made things difficult.\n\nI made this game because I couldn't be there to walk beside you through every obstacle, so I made you a little world where you could keep going, one step at a time, until you found me.\n\nI don't know exactly what the future will look like, or when we'll get the chance to see each other again. But I really do hope that one day, we'll get to make more memories together, in a world that doesn't have to be made of pixels.\n\nUntil then, I hope the little things we shared make you smile whenever you need them.\n\nAnd if you ever wonder whether you mattered to me, Bunny, just remember that I made an entire game about finding my way back to you.\n\nYou better appreciate the effort. 😭\n\nI love you, Ryaan. Always. ❤️\n\nYour Subhan"
};
const PRO=[['NARRATOR','BREAKING NEWS: THE GORILLA GLUE HAS COME OFF.'],['NARRATOR','Two idiots who were supposed to stick together have somehow been separated.'],['NARRATOR','Subhan is lost somewhere in this world. Ryaan must find him, restore the Gorilla Glue, and reunite their single shared braincell.'],['RYAAN','HE BETTER NOT HAVE LET THE GLUE DRY.'],['NARRATOR','Your mission: find Subhan. Your equipment: determination, one spoon, and approximately half a braincell.']];
const EXI=[['SYSTEM','WARNING: THE SHARED BRAINCELL HAS ENTERED LOW-POWER MODE.'],['SYSTEM','Complete five challenges to restore braincell functionality.'],['SYSTEM','Estimated combined intelligence: pending further investigation.']];

const num=(s,v,w)=>{s=nm(s);return s===w||(s!==''&&+s===v)};

 ['ADDITION','What is 7 + 5?',a=>num(a,12,'twelve')],
 ['SUBTRACTION','What is 15 - 8?',a=>num(a,7,'seven')],
 ['DIVISION','What is 24 \u00F7 6?',a=>num(a,4,'four')],
 ['THE EASIEST RIDDLE EVER',"What has hands but can't clap?",a=>/^(a |an |the )?clock$/.test(nt(a)),'BUNNY. PLEASE. WE NEED TO HAVE A CONVERSATION ABOUT THIS BRAINCELL.'],
 ['WHO DOES SUBHAN LOVE THE MOST?','FINAL EXAM QUESTION.<br>Who does Subhan love the most in this entire world?',a=>nt(a).split(' ').some(w=>w=='ryaan'||w=='bunny'),'INCORRECT. THE SHARED BRAINCELL IS DISAPPOINTED IN YOU. TRY AGAIN, BUNNY.']];
const BAD=['BRAINCELL BUFFERING... TRY AGAIN, BUNNY.','ERROR 404: HALF A BRAINCELL NOT FOUND.','CLOSE. NOT CLOSE ENOUGH. AGAIN.'];
const RX=["STOP THAT. IT'S A SPOON.","WHY IS THE SPOON SO POWERFUL?","I WAS NOT PREPARED FOR THIS.","THIS IS NOT HOW THE PROPHECY SAID I WOULD DIE.","OW. WHY IS IT SPOON SHAPED?","DEFEATED BY CUTLERY?!"];
const SLAP=[['RYAAN','WHY DID YOU LET THE GORILLA GLUE DRY OFF?!'],['SUBHAN',"I'M SORRY, BUNNY \uD83D\uDE2D"],['RYAAN',"YOU'RE LUCKY I LOVE YOU."],['SUBHAN','I LOVE YOU TOO.']];
/* ================= END PERSONALIZE ================= */

const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),W=480,H=270;
const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(x|0,y|0,w|0,h|0)};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let sd=7;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const ST=[];for(let i=0;i<70;i++)ST.push({x:rnd()*W,y:rnd()*150,s:rnd()<.2?2:1,p:rnd()*6});
const HPAT=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
let S='title',paused=false,t=0,lv=0,L,p,cam=0,B,EX,rt=0,hold=0,pt=0,bn=0,banner='',shake=0,flash=0,ft=0,bhp=5,inv=0,sw=0,dlg=null,tw;
let coll=[[],[],[]],bot=[0,0,0],done={};
const K={l:0,r:0,j:0},PT=[],AS=[{x:0,y:230,w:W,h:40}];
const hearts=()=>coll.reduce((a,l)=>a+l.filter(Boolean).length,0);

/* ---------- drawing helpers ---------- */
function disc(cx,cy,r,c){X.fillStyle=c;for(let j=-r;j<=r;j++){const w=Math.sqrt(r*r-j*j)|0;X.fillRect((cx-w)|0,(cy+j)|0,2*w,1)}}
function heart(x,y,s,c){X.fillStyle=c;HPAT.forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]=='X')X.fillRect((x+i*s)|0,(y+j*s)|0,s,s)})}
function txt(s,x,y,z,c,a,ns){X.font='bold '+z+'px "Press Start 2P","Courier New",monospace';X.textAlign=a||'center';if(!ns){X.fillStyle='#000';X.fillText(s,x+1,y+1)}X.fillStyle=c||'#fff1e0';X.fillText(s,x,y)}
function bottle(x,y,s,gl,dry){
 if(gl){X.globalAlpha=.25+.1*Math.sin(t*.1);disc(x+4*s,y+7*s,9*s,'#ffd36b');X.globalAlpha=1}
 const a=dry?'#9a948f':'#e8901a',b=dry?'#d9d3cc':'#fff1e0',c=dry?'#6f6a66':'#3a2a1a';
 R(x+2*s,y,4*s,2*s,c);R(x+s,y+2*s,6*s,10*s,a);R(x+s,y+5*s,6*s,4*s,b);R(x+3*s,y+6*s,2*s,2*s,c);R(x+s,y+12*s,6*s,s,dry?'#6f6a66':'#b86a10')}
function hwb(x,y,s,gl){
 if(gl){for(let k=3;k>0;k--){X.globalAlpha=.14;disc((x+7*s)|0,(y+10*s)|0,((8+k*6+(t%12)/2)*s)|0,k%2?'#ffd36b':'#ff8fc0')}X.globalAlpha=1}
 R(x+5*s,y,4*s,2*s,'#6a4a8a');R(x+4*s,y+2*s,6*s,2*s,'#8a6aaa');
 R(x+2*s,y+4*s,10*s,13*s,'#ff8fb5');R(x+s,y+6*s,12*s,9*s,'#ff8fb5');
 for(let i=0;i<4;i++)R(x+3*s,y+(7+i*2.5)*s,8*s,s,'#e8689a');
 R(x+3*s,y+5*s,2*s,3*s,'#ffd1e0');R(x+4*s,y+17*s,6*s,s,'#c0668d')}
function person(who,cx,y,fl,fr,o){
 o=o||{};const c=who=='r'?CFG.ryaan:CFG.subhan,hr=c.hair,sk=c.skin,ou=c.outfit;
 X.save();X.translate(cx|0,y|0);X.scale(fl<0?-1:1,1);
 if(who=='r'){R(-5,2,10,3,hr);R(-5,4,2,9,hr);R(3,4,2,9,hr)}else R(-4,1,8,3,hr);
 R(-3,3,6,6,o.back?hr:sk);
 if(!o.back){
  if(o.ouch){R(-2,6,2,1,'#2a1c30');R(1,6,2,1,'#2a1c30');R(-1,8,2,1,'#c0405a')}
  else{R(-1,6,1,2,'#2a1c30');R(2,6,1,2,'#2a1c30');R(-2,8,1,1,'#ff9bb5')}
  R(-4,2,8,2,hr)}
 R(-4,9,8,4,ou);R(-5,9,1,3,ou);R(4,9,1,3,ou);R(-5,12,1,1,sk);R(4,12,1,1,sk);
 if(who=='r')R(-5,12,10,2,ou);else R(-4,12,8,2,'#3a4a7a');
 const lg='#40334f';
 if(fr){R(-3,14,2,1,lg);R(1,14,2,2,lg)}else{R(-3,14,2,2,lg);R(1,14,2,1,lg)}
 X.restore()}
function arm(x,y,a,len,c,sk){for(let i=2;i<=len;i+=2)R(x+Math.cos(a)*i,y+Math.sin(a)*i,2,2,c);R(x+Math.cos(a)*(len+1),y+Math.sin(a)*(len+1),3,3,sk)}

/* ---------- sound (generated, no assets) ---------- */
let AC;
function snd(f,d,ty,v,s){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+(s||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.001,n+(d||.1));o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+(d||.1))}catch(e){}}
const win=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.18,'square',.04,i*.1));
const sHit=()=>{snd(300+Math.random()*200,.08,'triangle',.1);snd(150,.12,'sine',.1,.04)};

/* ---------- particles ---------- */
function sp(x,y,n,ty,o){o=o||{};for(let i=0;i<n;i++)PT.push({x,y,vx:(Math.random()-.5)*(o.s||2),vy:(Math.random()-.5)*(o.s||2)-(o.u||0),l:((o.l||40)+Math.random()*20)|0,m:0,ty,c:o.c,z:o.z||0})}
function stepPT(){for(let i=PT.length-1;i>=0;i--){const a=PT[i];a.x+=a.vx;a.y+=a.vy;a.m++;if(--a.l<0)PT.splice(i,1)}}
function drawPT(){for(const a of PT){const f=cl(a.l/20,0,1);X.globalAlpha=f;
 if(a.ty=='h')heart(a.x-3,a.y-3,1+a.z,a.c||'#ff7fa8');
 else if(a.ty=='s'){R(a.x-1,a.y,3,1,a.c||'#fff');R(a.x,a.y-1,1,3,a.c||'#fff')}
 else{X.globalAlpha=f*.6;disc(a.x|0,a.y|0,3+(a.m>>3),a.c||'#6a4a9a')}}
 X.globalAlpha=1}

function setS(s){S=s;$('hud').style.display=['play','boss','ult','fin','path','exam'].includes(s)?'flex':'none';$('ctl').style.display=['play','boss','path'].includes(s)?'flex':'none';$('atk').style.display=s=='boss'?'block':'none';$('ult').style.display='none'}

 clearInterval(dlg.iv);if(++dlg.i>=dlg.l.length){const d=dlg.done;dlg=null;$('box').style.display='none';d&&d()}else sayShow()}

function letter(txt,title,btn,cb,note){
 ov('<h2>'+title+'</h2><div id="lt"></div><button class="b" id="lb" style="visibility:hidden">'+btn+'</button>'+(note?'<div>'+note+'</div>':''));

/* ---------- levels ---------- */
const LV=[
 {n:'LEVEL 1: THE JOURNEY BEGINS',th:0,W:1700,goal:1620,
  pl:[[0,230,380],[430,230,300],[520,185,70],[780,230,200],[1030,195,60],[1130,160,60],[1230,195,60],[1330,230,370]],mv:[],

function build(i){const d=LV[i];L={n:d.n,th:d.th,W:d.W,goal:d.goal,h:d.h,b:d.b};
 L.sol=d.pl.map(a=>({x:a[0],y:a[1],w:a[2],h:a[1]>=225?40:10}));
 L.mv=d.mv.map(a=>({x:a[0],x0:a[0],ox:a[0],y:a[1],w:50,h:10,amp:a[2],sp:.02,mv:1}));
 L.sol.push(...L.mv)}
function newPlayer(x){return{x,y:214,vx:0,vy:0,w:10,h:16,g:null,face:1,fr:0,co:0,jh:0,sx:x,sy:214}}
function loadLevel(i){lv=i;build(i);p=newPlayer(30);cam=0;PT.length=0;banner=L.n;bn=160;setS('play');ov();hud()}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mvp(p,sol){
 p.x+=p.vx;for(const s of sol)if(hit(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w}
 p.y+=p.vy;p.g=null;for(const s of sol)if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.g=s}else if(p.vy<0)p.y=s.y+s.h;p.vy=0}}
